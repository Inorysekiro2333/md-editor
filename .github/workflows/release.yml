name: Release
on:
  push:
    tags: ['v*']
jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      HAS_CSC: ${{ secrets.CSC_LINK != '' }}
      HAS_APPLE: ${{ secrets.APPLE_ID != '' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:app
      - name: Build and publish (signed env only when secrets exist)
        run: pnpm exec electron-builder --publish always
        env:
          CSC_LINK: ${{ env.HAS_CSC == 'true' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ env.HAS_CSC == 'true' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ env.HAS_APPLE == 'true' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ env.HAS_APPLE == 'true' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ env.HAS_APPLE == 'true' && secrets.APPLE_TEAM_ID || '' }}
      - name: Annotate unsigned release
        if: ${{ matrix.os == 'ubuntu-latest' && env.HAS_CSC == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body="$(gh release view "$GITHUB_REF_NAME" --json body -q .body)"
          gh release edit "$GITHUB_REF_NAME" --notes "${body}

          > ⚠️ Unsigned build: no CSC_LINK secret configured, artifacts are not code-signed/notarized."
